<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F3EA">
  <title>رحّال — الاتصال غير متاح</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F7F3EA; color: #2B2F33; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.9; }
    main { width: 100%; max-width: 520px; padding: 32px; background: #fff; border: 1px solid #E2DCD0; border-radius: 20px; }
    .brand { margin: 0 0 8px; color: #8A6520; font-weight: 700; }
    h1 { margin: 0 0 16px; font-size: 1.5rem; line-height: 1.6; }
    p { margin: 0 0 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    button, a { min-height: 44px; padding: 10px 18px; border: 1px solid #E2DCD0; border-radius: 10px; color: #2B2F33; font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
    button { background: #F7F3EA; }
    a { background: #fff; }
    button:focus-visible, a:focus-visible { outline: 3px solid #8A6520; outline-offset: 3px; }
    @media (max-width: 400px) { main { padding: 24px; } .actions > * { width: 100%; } }
  </style>
</head>
<body>
  <main aria-labelledby="offline-title">
    <p class="brand">رحّال</p>
    <h1 id="offline-title">الاتصال غير متاح</h1>
    <p>أنت غير متصل بالإنترنت. عرض بياناتك وحفظ التغييرات يحتاجان إلى اتصال. لا تحفظ التغييرات دون اتصال.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <a href="/">الصفحة الرئيسية</a>
    </div>
  </main>
</body>
</html>
