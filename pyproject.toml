[project]
name = "ufuq"
version = "0.1.0"
description = "Youth development tracking platform for Horizon Program"
readme = "README.md"
authors = [{ name = "Mohammad Albuainain", email = "dev.mohammad@tuta.io" }]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "django-environ>=0.14.0",
    "django-unfold>=0.104.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
