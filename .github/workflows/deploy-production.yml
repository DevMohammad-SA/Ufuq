name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/ufuq_deploy_key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/ufuq_deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/ufuq_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            '/home/mohammad/deploy-ufuq.sh'
