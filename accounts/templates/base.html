<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}رحّال{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#2B2F33;
  --gold:#C79A3B;
  --white:#FFFFFF;
  --sand:#F7F3EA;
  --line:#E2DCD0;
  --slate:#5F676E;
  --gold-ink:#8A6520;
  --gold-soft:#F0E2C2;
  --alert:#B4553B;

  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px;
  --shadow:0 1px 2px rgba(43,47,51,.06),0 12px 32px -18px rgba(43,47,51,.35);

  --font-display:"Tajawal","Cairo","Segoe UI",sans-serif;
  --font-ui:"IBM Plex Sans Arabic","Tajawal",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--sand);
  color:var(--asphalt);
  font-family:var(--font-display);
  font-weight:400;
  font-size:17px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:var(--s3);
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.auth-shell{
  width:100%;
  max-width:960px;
  background:var(--white);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:560px;
}
@media (max-width:820px){
  .auth-shell{grid-template-columns:1fr; min-height:auto}
  .auth-side{display:none}
}

/* الجانب البصري: نفس فكرة "الطريق" من هوية رحّال */
.auth-side{
  background:var(--asphalt);
  color:#fff;
  position:relative;
  overflow:hidden;
  padding:var(--s4);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:var(--s4);
}
.auth-side .road{
  position:absolute;
  inset-inline-start:-30%;
  inset-block-start:-6%;
  height:112%;
  opacity:.14;
}
.auth-side .lockup{position:relative; display:flex; align-items:center; gap:14px}
.auth-side .wordmark{font-weight:800; font-size:28px}
.auth-side .tag{font-family:var(--font-ui); font-size:12px; color:var(--gold); letter-spacing:.1em}
.auth-side .pitch{position:relative; margin-top:auto}
.auth-side .pitch h2{font-size:clamp(22px,2.6vw,30px); font-weight:900; line-height:1.3; margin:0 0 var(--s2)}
.auth-side .pitch p{font-family:var(--font-ui); font-size:14px; color:#D8D2C5; max-width:34ch; margin:0}

/* جانب الفورم */
.auth-form-side{
  padding:clamp(28px,5vw,56px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.auth-form-side .eyebrow{
  font-family:var(--font-ui);
  font-size:12px;
  font-weight:600;
  color:var(--gold-ink);
  letter-spacing:.08em;
  margin-bottom:var(--s1);
}
.auth-form-side h1{
  font-weight:900;
  font-size:clamp(26px,3vw,32px);
  line-height:1.3;
  margin:0 0 var(--s1);
}
.auth-form-side .lead{
  font-family:var(--font-ui);
  font-size:14px;
  color:var(--slate);
  margin:0 0 var(--s3);
}

.field{margin-bottom:14px}
.field label{
  display:block;
  font-family:var(--font-ui);
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}
.field input{
  width:100%;
  font-family:var(--font-ui);
  font-size:15px;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:var(--r-sm);
  background:#fff;
  color:var(--asphalt);
}
.field input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(199,154,59,.18);
}
.field input[dir="ltr"]{text-align:left}
.field .hint{
  font-family:var(--font-ui);
  font-size:12px;
  color:var(--slate);
  margin-top:5px;
}

.form-error{
  background:#FBEEEA;
  border:1px solid var(--alert);
  border-radius:var(--r-sm);
  padding:12px 14px;
  font-family:var(--font-ui);
  font-size:13px;
  color:var(--alert);
  margin-bottom:var(--s2);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  font-family:var(--font-ui);
  font-weight:600;
  font-size:15px;
  border-radius:99px;
  padding:13px 22px;
  border:none;
  cursor:pointer;
  text-decoration:none;
  transition:.18s;
  min-height:44px;
}
.btn-gold{background:var(--gold); color:#241F14}
.btn-gold:hover{background:#B98B2E}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

.switch-portal{
  margin-top:var(--s3);
  padding-top:var(--s2);
  border-top:1px dashed var(--line);
  font-family:var(--font-ui);
  font-size:13px;
  color:var(--slate);
  text-align:center;
}
.switch-portal a{color:var(--gold-ink); font-weight:600; text-decoration:none}
.switch-portal a:hover{text-decoration:underline}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div class="lockup">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 20c2-8 6-8 8-16 2 8 6 8 8 16" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="wordmark">رحّال</div>
          <div class="tag">تعلم &middot; أنجز &middot; انطلق</div>
        </div>
      </div>
      <div class="pitch">
        {% block side_pitch %}
        <h2>١٤ أسبوعًا،<br>ووجهة واحدة.</h2>
        <p>حلقة يومية، محطة أسبوعية، ومهمة تطبيقية. كل إنجاز يتحوّل أميالًا.</p>
        {% endblock %}
      </div>
    </div>

    <div class="auth-form-side">
      {% block form_content %}{% endblock %}
    </div>
  </div>
</body>
</html>
