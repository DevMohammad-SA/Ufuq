# ---------------------------------------------------------------------------
# FULL HTTPS configuration.
#
# Activate this ONLY AFTER the first certificate has been issued
# successfully (docker/certbot-init.sh), otherwise Nginx cannot start
# because the ssl_certificate paths below do not exist yet.
#
# To activate, either:
#   A) copy it over the live file:
#        cp docker/nginx/nginx-ssl.conf docker/nginx/nginx.conf
#        docker compose up -d --force-recreate nginx
#   B) or point the nginx volume in docker-compose.yml at this file instead
#      of nginx.conf, then recreate nginx.
#
# See the deployment guide in the SSL task report for the exact sequence.
# ---------------------------------------------------------------------------

upstream django {
    server web:8000;
}

# Port 80: keep serving the ACME challenge (renewals also use HTTP-01),
# redirect everything else to HTTPS.
server {
    listen 80;
    server_name rahhal.saqeel.org.sa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: the real site.
server {
    listen 443 ssl;
    server_name rahhal.saqeel.org.sa;

    # 60M gives headroom over the largest hard per-format ceiling enforced
    # in participants/forms.py (TaskSubmissionForm.MAX_FILE_SIZES: video =
    # 50MB, audio = 15MB, pdf = 10MB; images have no ceiling — they're
    # downscaled/re-encoded server-side instead of size-checked).
    client_max_body_size 60M;

    ssl_certificate /etc/letsencrypt/live/rahhal.saqeel.org.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rahhal.saqeel.org.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
