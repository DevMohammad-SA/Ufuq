upstream django {
    server web:8000;
}

server {
    listen 80;
    # 60M gives headroom over the largest hard per-format ceiling enforced
    # in participants/forms.py (TaskSubmissionForm.MAX_FILE_SIZES: video =
    # 50MB, audio = 15MB, pdf = 10MB; images have no ceiling — they're
    # downscaled/re-encoded server-side instead of size-checked).
    client_max_body_size 60M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
