# ---------------------------------------------------------------------------
# BOOTSTRAP configuration (HTTP only).
#
# This is the version that must be active the FIRST time the stack comes up
# and while the very first Let's Encrypt certificate is being issued:
#   * Certbot's webroot challenge needs `/.well-known/acme-challenge/` served
#     over plain HTTP on port 80.
#   * There is no certificate yet, so a `listen 443 ssl` block referencing
#     /etc/letsencrypt/live/... would make Nginx fail to start entirely.
#
# After the certificate exists (see docker/certbot-init.sh), switch to the
# full HTTPS configuration in docker/nginx/nginx-ssl.conf — see the
# deployment guide in the SSL task report.
# ---------------------------------------------------------------------------

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name rahhal.saqeel.org.sa;

    # 60M gives headroom over the largest hard per-format ceiling enforced
    # in participants/forms.py (TaskSubmissionForm.MAX_FILE_SIZES: video =
    # 50MB, audio = 15MB, pdf = 10MB; images have no ceiling — they're
    # downscaled/re-encoded server-side instead of size-checked).
    client_max_body_size 60M;

    # ACME HTTP-01 challenge files written by the certbot container into the
    # shared certbot_www volume.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
